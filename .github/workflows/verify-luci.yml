name: Verify LuCI theme/apps (M28C 6.12)

on:
  workflow_dispatch:
    inputs:
      prep_cache_key:
        description: exact verify-matrix prepare cache key to reuse (blank = full build)
        required: false
        default: ""

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  verify-luci:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 1. free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: 2. install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-yaml \
            libpython3-dev rsync swig unzip zlib1g-dev file wget \
            libelf-dev bc device-tree-compiler

      - name: 2b. restore cached staging_dir/dl/feeds (fast path; full build if miss)
        uses: actions/cache/restore@v4
        with:
          # NOTE: actions/cache version-hashes this exact path list, so it must match
          # .github/workflows/verify-matrix.yml (prepare save step) byte for byte.
          path: |
            immortalwrt/staging_dir
            immortalwrt/dl
            immortalwrt/feeds
            immortalwrt/.config
            immortalwrt/build_dir/target-aarch64_generic_musl/linux-rockchip_armv8
            immortalwrt/build_dir/host
            immortalwrt/build_dir/hostpkg
            immortalwrt/build_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
          key: ${{ inputs.prep_cache_key || format('m28c-prep-{0}', github.run_id) }}
          restore-keys: |
            m28c-prep-v2-
            m28c-prep-

      - name: 3. clone tree + pinned feeds
        run: |
          git init immortalwrt
          cd immortalwrt
          git remote add origin https://github.com/immortalwrt/immortalwrt.git
          git fetch --depth 1 origin a302626ef448242574d00af0acc5ed1ef851cbe3
          git checkout -q FETCH_HEAD
          cat > feeds.conf <<'EOF'
          src-git packages   https://github.com/immortalwrt/packages.git^3714a28d393e14a20c8359f3f640f61ca757636a
          src-git luci       https://github.com/immortalwrt/luci.git^6bcf30cb319f36414a8dfaffa35b6e249a2cac02
          src-git routing    https://github.com/openwrt/routing.git^776e7160636a7f1add27483ac926dadeb248bb65
          src-git telephony  https://github.com/openwrt/telephony.git^4d8d33a023b24c52cd9443b9dc201fbdfe9c6aef
          src-git video      https://github.com/openwrt/video.git^393e8eac5b45c5a1dc455ffe0e19e7651ad508a3
          src-git qmodem     https://github.com/FUjr/QModem.git^0988085b887346ae9477ef2e77abe2f797bd2c4a
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for f in target/linux/generic/config-6.12 target/linux/rockchip/config-6.12; do
            [ -f "$f" ] && grep -q "CONFIG_WERROR" "$f" || printf '# CONFIG_WERROR is not set\n' >> "$f"
          done

      - name: 3d. touch restored build stamps (git checkout mtime must not trigger rebuilds)
        run: |
          cd immortalwrt
          find staging_dir build_dir -name '.built*' -o -name '.configured*' -o -name '.prepared*' 2>/dev/null | xargs -r touch
          echo "stamps touched: $(find staging_dir build_dir -name '.built*' 2>/dev/null | wc -l) built-stamps"

      - name: 3b. attr 2.5.2 + libgen patch
        run: |
          cd immortalwrt
          sed -i -e 's/^PKG_VERSION:=.*/PKG_VERSION:=2.5.2/' -e 's/^PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/utils/attr/Makefile
          mkdir -p feeds/packages/utils/attr/patches
          echo 'LS0tIGEvdG9vbHMvYXR0ci5jCisrKyBiL3Rvb2xzL2F0dHIuYwpAQCAtMTcsNiArMTcsNyBAQAogICovCiAKICNpbmNsdWRlICJjb25maWcuaCIKKyNpbmNsdWRlIDxsaWJnZW4uaD4KIAogI2luY2x1ZGUgPHN5cy90eXBlcy5oPgogI2luY2x1ZGUgPHN5cy9wYXJhbS5oPgo=' | base64 -d > feeds/packages/utils/attr/patches/100-libgen.patch

      - name: 3c. patch feed OAF package (warnings stay warnings)
        run: |
          cd immortalwrt
          F=feeds/packages/net/open-app-filter/Makefile
          if [ -f "$F" ] && ! grep -q OAFLOCALFIX "$F"; then
            echo '' | base64 -d >> "$F"
            echo "OAF feed patched"
          fi
          tail -n 14 "$F"

      - name: 4. OAF pinned + vendor argon/fancontrol
        run: |
          cd immortalwrt
          git init package/OpenAppFilter
          cd package/OpenAppFilter
          git remote add origin https://github.com/destan19/OpenAppFilter.git
          git fetch --depth 1 origin 569f93bfd56afc3ae8c21f13fc973926ff6629a5
          git checkout -q FETCH_HEAD
          cd ../..
          git clone https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-theme
          git -C /tmp/argon-theme checkout -q 3c8dc64bca054be0c184dc1dc9847b249710a466
          mkdir -p package/luci-theme-argon
          cp -r /tmp/argon-theme/. package/luci-theme-argon/
          rm -rf package/luci-theme-argon/.git
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-master
          cp -r /tmp/argon-master/compat/luci-app-argon-config package/luci-app-argon-config
          rm -rf package/luci-app-argon-config/.git
          git clone --depth 1 https://github.com/immortalwrt/luci.git /tmp/iluci
          cp -r /tmp/iluci/applications/luci-app-fancontrol package/luci-app-fancontrol
          git clone --depth 1 https://github.com/immortalwrt/packages.git /tmp/ipkgs
          cp -r /tmp/ipkgs/utils/fancontrol package/fancontrol
          rm -rf package/luci-app-fancontrol/.git package/fancontrol/.git

      - name: 4b. vendor checks + de-dupe luci-app-argon-config
        run: |
          cd immortalwrt
          echo "=== pinned feed has its own luci-app-argon-config? ==="
          ls -ld package/feeds/luci/luci-app-argon-config 2>/dev/null || echo "no feed copy"
          if [ -e package/feeds/luci/luci-app-argon-config ] || [ -L package/feeds/luci/luci-app-argon-config ]; then
            echo "REMOVE feed duplicate so the vendored master compat/ package is the one built"
            rm -rf package/feeds/luci/luci-app-argon-config
          fi
          echo "=== rewrite relative luci.mk include for root-vendored luci apps ==="
          for m in package/*/Makefile; do
            [ -f "$m" ] || continue
            if grep -q '^include \.\./\.\./luci\.mk' "$m"; then
              echo "FIX $m : ../../luci.mk -> \$(TOPDIR)/feeds/luci/luci.mk"
              sed -i 's|^include \.\./\.\./luci\.mk$|include $(TOPDIR)/feeds/luci/luci.mk|' "$m"
            fi
          done
          echo "=== vendored package versions ==="
          for p in luci-theme-argon luci-app-argon-config luci-app-fancontrol fancontrol; do
            echo "--- package/$p ---"
            grep -hE '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|LUCI_DEPENDS)' "package/$p/Makefile" || true
            grep -n 'luci\.mk' "package/$p/Makefile" || true
          done

      - name: 5. config + defconfig
        run: |
          cd immortalwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_widora_mangopi-m28c=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-fancontrol=y
          CONFIG_PACKAGE_fancontrol=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-3ginfo-lite=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_kmod-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF
          sed -i 's/^ *//' .config
          make defconfig >/dev/null
          echo "=== config sanity (warn only; the loop reports real results) ==="
          for k in luci-theme-argon luci-app-argon-config luci-app-fancontrol fancontrol \
                   luci-app-cpufreq luci-app-3ginfo-lite luci-app-oaf luci-app-smartdns \
                   luci-app-adguardhome luci-i18n-base-zh-cn; do
            grep -q "^CONFIG_PACKAGE_$k=y" .config && echo "CONFIG OK $k" || echo "CONFIG MISSING $k"
          done

      - name: 6. build host tools + toolchain, then kernel (kmod deps need it)
        run: |
          cd immortalwrt
          make -j$(nproc) tools/install toolchain/install V=s > "$GITHUB_WORKSPACE/prep.log" 2>&1 || { tail -n 80 "$GITHUB_WORKSPACE/prep.log"; exit 1; }
          echo "tools+toolchain ok"
          # luci-app-3ginfo-lite depends on kmod-usb-serial-option and luci-app-oaf on kmod-oaf, so their
          # compile targets also build those kmod packages. A kmod target fails with
          # "No rule to make target '.../linux-6.12.91/.config'" unless Kernel/Configure has run, which
          # only happens for target/linux/* (there is no rule for $(LINUX_DIR)/.config in package context).
          make -j$(nproc) target/linux/compile V=s > "$GITHUB_WORKSPACE/kernel.log" 2>&1 || { tail -n 120 "$GITHUB_WORKSPACE/kernel.log"; exit 1; }
          echo "kernel ok"

      - name: 7. compile luci/theme/apps one by one
        run: |
          cd immortalwrt
          LOG="$GITHUB_WORKSPACE/check.log"
          : > "$LOG"
          FAIL=0
          for pkg in luci-theme-argon luci-app-argon-config fancontrol luci-app-fancontrol \
                     luci-app-cpufreq luci-app-3ginfo-lite luci-app-smartdns luci-app-adguardhome \
                     luci-app-oaf; do
            echo "===== $pkg =====" | tee -a "$LOG"
            if make -j$(nproc) "package/$pkg/compile" V=s >>"$LOG" 2>&1; then
              echo "RESULT_OK $pkg" | tee -a "$LOG"
            else
              echo "RESULT_FAIL $pkg" | tee -a "$LOG"
              FAIL=1
            fi
          done
          # luci-i18n-* are sub-packages of modules/luci-base. OpenWrt only generates per-package make
          # targets for dirs that scripts/feeds installed a symlink for (package/feeds/luci/luci-base),
          # so 'package/luci-i18n-base-zh-cn/compile' does not exist; compile the parent dir and then
          # prove the i18n package artifact was actually produced.
          echo "===== luci-i18n-base-zh-cn (via package/luci-base/compile) =====" | tee -a "$LOG"
          I18N_ART="$(make -j$(nproc) package/luci-base/compile V=s >>"$LOG" 2>&1 && ls bin/packages/*/*/luci-i18n-base-zh-cn-*.apk bin/packages/*/*/luci-i18n-base-zh-cn-*.ipk 2>/dev/null | head -n1)" || true
          if [ -n "$I18N_ART" ]; then
            echo "i18n artifact: $I18N_ART" | tee -a "$LOG"
            echo "RESULT_OK luci-i18n-base-zh-cn" | tee -a "$LOG"
          else
            echo "RESULT_FAIL luci-i18n-base-zh-cn" | tee -a "$LOG"
            FAIL=1
          fi
          echo "===== summary ====="
          grep -E 'RESULT_(OK|FAIL)' "$LOG"
          if [ "$FAIL" = "1" ]; then
            echo "===== failure diagnostics ====="
            grep -nE 'No rule to make target|ERROR:|error:|\*\*\*' "$LOG" | tail -n 120 || true
            exit 1
          fi
          echo "ALL_PACKAGES_OK"

      - name: 8. upload check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-luci-log
          path: check.log
          if-no-files-found: warn
          retention-days: 7

      - name: 9. upload prep/kernel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-luci-prep-log
          path: |
            prep.log
            kernel.log
          if-no-files-found: warn
          retention-days: 7

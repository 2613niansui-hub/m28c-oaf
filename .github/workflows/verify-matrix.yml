name: Verify matrix (fast, cached)

on:
  workflow_dispatch:
    inputs:
      cache_tag:
        description: cache version tag
        required: false
        default: v1

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-yaml \
            libpython3-dev rsync swig unzip zlib1g-dev file wget \
            libelf-dev bc device-tree-compiler
      - name: restore previous prepare cache (skip toolchain rebuild)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt/staging_dir
            immortalwrt/dl
            immortalwrt/feeds
            immortalwrt/.config
          key: m28c-prep-${{ inputs.cache_tag }}-${{ github.run_id }}
          restore-keys: |
            m28c-prep-${{ inputs.cache_tag }}-

      - name: checkout tree + pinned feeds + patches
        run: |
          git init immortalwrt
          cd immortalwrt
          git remote add origin https://github.com/immortalwrt/immortalwrt.git
          git fetch --depth 1 origin a302626ef448242574d00af0acc5ed1ef851cbe3
          git checkout -q FETCH_HEAD
          cat > feeds.conf <<'EOF'
          src-git packages   https://github.com/immortalwrt/packages.git^3714a28d393e14a20c8359f3f640f61ca757636a
          src-git luci       https://github.com/immortalwrt/luci.git^6bcf30cb319f36414a8dfaffa35b6e249a2cac02
          src-git routing    https://github.com/openwrt/routing.git^776e7160636a7f1add27483ac926dadeb248bb65
          src-git telephony  https://github.com/openwrt/telephony.git^4d8d33a023b24c52cd9443b9dc201fbdfe9c6aef
          src-git video      https://github.com/openwrt/video.git^393e8eac5b45c5a1dc455ffe0e19e7651ad508a3
          src-git qmodem     https://github.com/FUjr/QModem.git^0988085b887346ae9477ef2e77abe2f797bd2c4a
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/apply-patches.sh 2>/dev/null || true
      - name: apply known patches (attr + OAF warnings)
        run: |
          cd immortalwrt
          if [ -f feeds/packages/utils/attr/Makefile ]; then
            sed -i -e 's/^PKG_VERSION:=.*/PKG_VERSION:=2.5.2/' -e 's/^PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/utils/attr/Makefile
            mkdir -p feeds/packages/utils/attr/patches
            echo 'LS0tIGEvdG9vbHMvYXR0ci5jCisrKyBiL3Rvb2xzL2F0dHIuYwpAQCAtMTcsNiArMTcsNyBAQAogICovCiAKICNpbmNsdWRlICJjb25maWcuaCIKKyNpbmNsdWRlIDxsaWJnZW4uaD4KIAogI2luY2x1ZGUgPHN5cy90eXBlcy5oPgogI2luY2x1ZGUgPHN5cy9wYXJhbS5oPgo=' | base64 -d > feeds/packages/utils/attr/patches/100-libgen.patch
          fi
          python3 ../.github/oaf-patch.py feeds/packages/net/open-app-filter/Makefile
      - name: vendor argon + fancontrol + OAF clone
        run: |
          cd immortalwrt
          git init package/OpenAppFilter
          cd package/OpenAppFilter
          git remote add origin https://github.com/destan19/OpenAppFilter.git
          git fetch --depth 1 origin 569f93bfd56afc3ae8c21f13fc973926ff6629a5
          git checkout -q FETCH_HEAD
          cd ../..
          git clone https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-theme
          git -C /tmp/argon-theme checkout -q 3c8dc64bca054be0c184dc1dc9847b249710a466
          mkdir -p package/luci-theme-argon && cp -r /tmp/argon-theme/. package/luci-theme-argon/ && rm -rf package/luci-theme-argon/.git
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-master
          cp -r /tmp/argon-master/compat/luci-app-argon-config package/luci-app-argon-config && rm -rf package/luci-app-argon-config/.git
          git clone --depth 1 https://github.com/immortalwrt/luci.git /tmp/iluci
          cp -r /tmp/iluci/applications/luci-app-fancontrol package/luci-app-fancontrol
          git clone --depth 1 https://github.com/immortalwrt/packages.git /tmp/ipkgs
          cp -r /tmp/ipkgs/utils/fancontrol package/fancontrol
          rm -rf package/luci-app-fancontrol/.git package/fancontrol/.git
      - name: config
        run: |
          cd immortalwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_widora_mangopi-m28c=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-fancontrol=y
          CONFIG_PACKAGE_fancontrol=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-3ginfo-lite=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_tom_modem=y
          CONFIG_PACKAGE_ubus-at-daemon=y
          CONFIG_PACKAGE_qmodem-smsd=y
          CONFIG_PACKAGE_sms-forwarder-next=y
          CONFIG_PACKAGE_libqmodem-sms=y
          CONFIG_PACKAGE_modem_scan=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_kmod-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          EOF
          sed -i 's/^ *//' .config
          make defconfig >/dev/null
      - name: build host tools + toolchain (skip when restored)
        id: prep
        run: |
          cd immortalwrt
          if ls -d staging_dir/toolchain-* >/dev/null 2>&1; then
            echo "cache_hit=1" >> "$GITHUB_OUTPUT"
            echo "toolchain restored from cache, skip build"
          else
            echo "cache_hit=0" >> "$GITHUB_OUTPUT"
            make -j$(nproc) tools/install toolchain/install V=s > /tmp/prep.log 2>&1 || { tail -n 80 /tmp/prep.log; exit 1; }
            make download -j8 >/dev/null 2>&1 || true
            echo "prepared ok"
          fi
      - name: save cache
        if: steps.prep.outputs.cache_hit == '0'
        uses: actions/cache/save@v4
        with:
          path: |
            immortalwrt/staging_dir
            immortalwrt/dl
            immortalwrt/feeds
            immortalwrt/.config
          key: m28c-prep-${{ inputs.cache_tag }}-${{ github.run_id }}

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: oaf
            pkgs: "feeds/packages/open-app-filter OpenAppFilter/luci-app-oaf"
          - area: qmodem-core
            pkgs: "qmodem tom_modem ubus-at-daemon"
          - area: qmodem-sms
            pkgs: "qmodem-smsd sms-forwarder-next libqmodem-sms modem_scan luci-app-qmodem-next"
          - area: ui-theme
            pkgs: "luci-theme-argon luci-app-argon-config fancontrol luci-app-fancontrol"
          - area: ui-apps
            pkgs: "luci-app-cpufreq luci-app-3ginfo-lite luci-app-smartdns luci-app-adguardhome luci-i18n-base-zh-cn"
          - area: kmods
            pkgs: "kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan kmod-nft-tproxy kmod-tun kmod-usb-storage kmod-fs-ext4 kmod-fs-exfat kmod-fs-ntfs3 kmod-fs-vfat"
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          sudo apt-get clean
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-yaml \
            libpython3-dev rsync swig unzip zlib1g-dev file wget libelf-dev bc device-tree-compiler
      - name: restore cache (staging/dl/feeds/config)
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt/staging_dir
            immortalwrt/dl
            immortalwrt/feeds
            immortalwrt/.config
          key: m28c-prep-${{ inputs.cache_tag }}-${{ github.run_id }}
          restore-keys: |
            m28c-prep-${{ inputs.cache_tag }}-
      - name: checkout tree + pins + patches
        run: |
          git init immortalwrt
          cd immortalwrt
          git remote add origin https://github.com/immortalwrt/immortalwrt.git
          git fetch --depth 1 origin a302626ef448242574d00af0acc5ed1ef851cbe3
          git checkout -q FETCH_HEAD
          cat > feeds.conf <<'EOF'
          src-git packages   https://github.com/immortalwrt/packages.git^3714a28d393e14a20c8359f3f640f61ca757636a
          src-git luci       https://github.com/immortalwrt/luci.git^6bcf30cb319f36414a8dfaffa35b6e249a2cac02
          src-git routing    https://github.com/openwrt/routing.git^776e7160636a7f1add27483ac926dadeb248bb65
          src-git telephony  https://github.com/openwrt/telephony.git^4d8d33a023b24c52cd9443b9dc201fbdfe9c6aef
          src-git video      https://github.com/openwrt/video.git^393e8eac5b45c5a1dc455ffe0e19e7651ad508a3
          src-git qmodem     https://github.com/FUjr/QModem.git^0988085b887346ae9477ef2e77abe2f797bd2c4a
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: re-apply attr + OAF feed patches
        run: |
          cd immortalwrt
          if [ -f feeds/packages/utils/attr/Makefile ]; then
            sed -i -e 's/^PKG_VERSION:=.*/PKG_VERSION:=2.5.2/' -e 's/^PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/utils/attr/Makefile
            mkdir -p feeds/packages/utils/attr/patches
            echo 'LS0tIGEvdG9vbHMvYXR0ci5jCisrKyBiL3Rvb2xzL2F0dHIuYwpAQCAtMTcsNiArMTcsNyBAQAogICovCiAKICNpbmNsdWRlICJjb25maWcuaCIKKyNpbmNsdWRlIDxsaWJnZW4uaD4KIAogI2luY2x1ZGUgPHN5cy90eXBlcy5oPgogI2luY2x1ZGUgPHN5cy9wYXJhbS5oPgo=' | base64 -d > feeds/packages/utils/attr/patches/100-libgen.patch
          fi
          python3 ../.github/oaf-patch.py feeds/packages/net/open-app-filter/Makefile
      - name: vendor packages
        run: |
          cd immortalwrt
          git init package/OpenAppFilter
          cd package/OpenAppFilter
          git remote add origin https://github.com/destan19/OpenAppFilter.git
          git fetch --depth 1 origin 569f93bfd56afc3ae8c21f13fc973926ff6629a5
          git checkout -q FETCH_HEAD
          cd ../..
          git clone https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-theme
          git -C /tmp/argon-theme checkout -q 3c8dc64bca054be0c184dc1dc9847b249710a466
          mkdir -p package/luci-theme-argon && cp -r /tmp/argon-theme/. package/luci-theme-argon/ && rm -rf package/luci-theme-argon/.git
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-master
          cp -r /tmp/argon-master/compat/luci-app-argon-config package/luci-app-argon-config && rm -rf package/luci-app-argon-config/.git
          git clone --depth 1 https://github.com/immortalwrt/luci.git /tmp/iluci
          cp -r /tmp/iluci/applications/luci-app-fancontrol package/luci-app-fancontrol
          git clone --depth 1 https://github.com/immortalwrt/packages.git /tmp/ipkgs
          cp -r /tmp/ipkgs/utils/fancontrol package/fancontrol
          rm -rf package/luci-app-fancontrol/.git package/fancontrol/.git
      - name: defconfig (uses cached .config)
        run: |
          cd immortalwrt
          make defconfig >/dev/null
          case "${{ matrix.area }}" in
            oaf) echo "skip config check for feed-dir targets" ;;
            *) for p in ${{ matrix.pkgs }}; do
                 grep -q "^CONFIG_PACKAGE_$p=y" .config && echo "CONFIG_OK $p" || echo "CONFIG_DROPPED $p"
               done ;;
          esac
      - name: kernel prepare (kmod targets need generated kernel .config)
        run: |
          cd immortalwrt
          case "${{ matrix.area }}" in
            oaf|kmods) make -j$(nproc) target/linux/prepare V=s > /tmp/kprepare.log 2>&1 || { tail -n 60 /tmp/kprepare.log; exit 1; } ;;
            *) echo "skip kernel prepare" ;;
          esac
      - name: compile area packages
        run: |
          cd immortalwrt
          : > /tmp/results.txt
          echo "===== AREA ${{ matrix.area }} ====="
          for p in ${{ matrix.pkgs }}; do
            if make -j$(nproc) "package/$p/compile" V=s > "/tmp/$p.log" 2>&1; then
              echo "RESULT_OK $p" | tee -a /tmp/results.txt
            else
              echo "RESULT_FAIL $p" | tee -a /tmp/results.txt
              tail -n 60 "/tmp/$p.log"
            fi
          done
          echo "===== summary ====="
          cat /tmp/results.txt
          if grep -q RESULT_FAIL /tmp/results.txt; then exit 1; fi
      - name: upload area log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.area }}-log
          path: /tmp/*.log
          retention-days: 7

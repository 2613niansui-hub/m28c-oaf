name: Build ImmortalWrt 6.18 + OAF for M28C

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 0. checkout (so a failed build can publish its log)
        uses: actions/checkout@v4

      - name: 1. free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: 2. install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-yaml \
            libpython3-dev rsync swig unzip zlib1g-dev file wget \
            libelf-dev bc device-tree-compiler

      - name: 3. clone immortalwrt master (kernel 6.18, has RK3528 M28C) + feeds
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          printf '\nsrc-git qmodem https://github.com/FUjr/QModem.git^0988085b887346ae9477ef2e77abe2f797bd2c4a\n' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 关键：feeds/packages 里也有旧版 open-app-filter，会盖掉 clone 的 7.0.2
          rm -rf feeds/packages/net/open-app-filter
          rm -f package/feeds/packages/open-app-filter
          echo "removed stale feed open-app-filter (dir + link)"
          echo "=== kernel version ==="
          grep -E 'KERNEL_PATCHVER' target/linux/rockchip/Makefile || true
          echo "=== m28c device present? ==="
          grep -A3 'Device/widora_mangopi-m28c' target/linux/rockchip/image/armv8.mk

      - name: 4. add OpenAppFilter (upstream master, adapted for kernel 6.18)
        run: |
          cd immortalwrt
          git clone --depth 1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter
          ls package/OpenAppFilter

      - name: "4a. fallback - patch feed open-app-filter if it still exists"
        run: |
          cd immortalwrt
          if [ -f feeds/packages/net/open-app-filter/Makefile ]; then
            python3 ../.github/oaf-patch.py feeds/packages/net/open-app-filter/Makefile
          else
            echo "feed open-app-filter absent (good: using clone)"
          fi

      - name: 4b. vendor argon config page (not in master luci feed)
        run: |
          cd immortalwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git /tmp/argon-master
          if [ -d /tmp/argon-master/compat/luci-app-argon-config ]; then
            cp -r /tmp/argon-master/compat/luci-app-argon-config package/luci-app-argon-config
            rm -rf package/luci-app-argon-config/.git
            sed -i "s#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#" package/luci-app-argon-config/Makefile || true
            echo "argon-config vendored"
          else
            echo "WARN no compat/luci-app-argon-config"
          fi

      - name: 5. write .config (full feature set)
        run: |
          cd immortalwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_widora_mangopi-m28c=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_kmod-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-app-3ginfo-lite=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_cpufreq=y
          CONFIG_PACKAGE_luci-app-fancontrol=y
          CONFIG_PACKAGE_fancontrol=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_luci-i18n-qmodem-next-zh-cn=y
          CONFIG_PACKAGE_qmodem=y
          CONFIG_PACKAGE_tom_modem=y
          CONFIG_PACKAGE_ubus-at-daemon=y
          CONFIG_PACKAGE_qmodem-smsd=y
          CONFIG_PACKAGE_sms-forwarder-next=y
          CONFIG_PACKAGE_libqmodem-sms=y
          CONFIG_PACKAGE_modem_scan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_vsftpd=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          sed -i 's/^ *//' .config
          make defconfig
          echo "=== config sanity ==="
          for k in CONFIG_TARGET_rockchip_armv8_DEVICE_widora_mangopi-m28c CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_luci-app-cpufreq CONFIG_PACKAGE_cpufreq CONFIG_PACKAGE_luci-app-fancontrol CONFIG_PACKAGE_luci-app-3ginfo-lite CONFIG_PACKAGE_qmodem CONFIG_PACKAGE_luci-app-oaf CONFIG_PACKAGE_kmod-oaf CONFIG_PACKAGE_appfilter CONFIG_PACKAGE_luci-i18n-base-zh-cn CONFIG_TARGET_ROOTFS_PARTSIZE; do
            grep -q "^$k=" .config && echo "OK $k" || echo "WARN dropped $k"
          done

      - name: 6. preinstall m28c-vpn scripts + OAF tuning defaults
        run: |
          cd immortalwrt
          if [ -d ../m28c-vpn ]; then
            mkdir -p files/usr/sbin files/etc/init.d \
                     files/etc/hotplug.d/iface files/etc/hotplug.d/block
            cp -f ../m28c-vpn/usr/sbin/mihomo-vpn        files/usr/sbin/
            cp -f ../m28c-vpn/usr/sbin/nasctl            files/usr/sbin/
            cp -f ../m28c-vpn/etc/init.d/mihomo-vpn      files/etc/init.d/
            cp -f ../m28c-vpn/etc/init.d/nas             files/etc/init.d/
            cp -f ../m28c-vpn/etc/hotplug.d/iface/99-mihomo-vpn files/etc/hotplug.d/iface/
            cp -f ../m28c-vpn/etc/hotplug.d/block/50-nas-share  files/etc/hotplug.d/block/
            chmod 755 files/usr/sbin/* files/etc/init.d/*
            echo "m28c-vpn preinstalled"
          else
            echo "no m28c-vpn dir, skip"
          fi
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-oaf-tuning <<'EOF'
          #!/bin/sh
          # OAF docs: flow offloading / NAT offload breaks DPI; keep it off
          uci set firewall.@defaults[0].flow_offloading='0' 2>/dev/null
          uci set firewall.@defaults[0].flow_offloading_hw='0' 2>/dev/null
          uci commit firewall 2>/dev/null
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-oaf-tuning

      - name: 6b. add static mihomo binary
        run: |
          cd immortalwrt
          mkdir -p files/usr/bin
          wget -qO- https://github.com/MetaCubeX/mihomo/releases/download/v1.19.18/mihomo-linux-arm64-v1.19.18.gz | gunzip > files/usr/bin/mihomo
          chmod 755 files/usr/bin/mihomo
          files/usr/bin/mihomo -v || true

      - name: 7. predownload sources
        run: |
          cd immortalwrt
          make download -j8 || true

      - name: 8. build
        run: |
          cd immortalwrt
          set -o pipefail
          ( make -j$(nproc) V=s 2>&1 || make -j1 V=s 2>&1 ) | tee "$GITHUB_WORKSPACE/build.log"

      - name: 8b. publish build log on failure
        if: failure()
        run: |
          tail -n 400 build.log > build-error.txt 2>/dev/null || echo "no log" > build-error.txt
          if grep -q "ERROR: package/" build.log; then grep "ERROR: package/" build.log | tail -n 20 >> build-error.txt; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-error.txt
          git commit -m "ci: build error log [skip ci]" || true
          git push || true

      - name: 9. collect images
        run: |
          mkdir -p out
          find immortalwrt/bin/targets/rockchip/armv8 -maxdepth 1 -name "*m28c*" -exec cp -v {} out/ \;
          ls -lh out/
          test -n "$(ls -A out)" || { echo "NO M28C IMAGE PRODUCED"; exit 1; }
          MF=$(ls out/*.manifest | head -n1)
          echo "=== OAF version check ==="
          grep -E '^(kmod-oaf|appfilter|luci-app-oaf) ' "$MF" || true
          grep -q 'kmod-oaf .*7\.0\.2' "$MF" || { echo "OAF NOT 7.0.2 - ABORT"; exit 1; }
          echo "=== argon/mihomo check ==="
          grep -E '^(luci-theme-argon|luci-app-argon-config|luci-i18n-base-zh-cn) ' "$MF" || true

      - name: 10. upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-m28c-oaf-618
          path: out/*
          retention-days: 30
